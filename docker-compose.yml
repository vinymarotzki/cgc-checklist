services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    profiles:
      - prod

  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    # CGC_APP_URL do .env.local (http://localhost:3001) so funciona rodando
    # `npm run dev` direto no host: dentro do container, `localhost` aponta
    # pro proprio container, nao pro host onde o sasi-cgc esta publicado.
    # `environment:` tem precedencia sobre `env_file:` pra mesma chave, entao
    # isso sobrescreve so dentro do container (perfil dev, local), sem tocar
    # no .env.local nem em deploys reais (perfil prod nao tem esse override —
    # la, CGC_APP_URL vem so do .env.local/env de deploy).
    environment:
      - WATCHPACK_POLLING=true
      - CGC_APP_URL=http://host.docker.internal:3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    profiles:
      - dev
