services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    profiles:
      - prod

  dev:
    build:
      context: .
      target: dev
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    environment:
      - WATCHPACK_POLLING=true
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    profiles:
      - dev
