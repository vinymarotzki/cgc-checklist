name: Sincroniza atividades do CGC

# Substitui o cron nativo do Vercel: o plano Hobby limita cron a 1x/dia, longe
# de tempo real. Sem isso, /api/cgc/cron-sync (e o notify que ela dispara)
# só rodava como efeito colateral de alguém ter a página do grupo aberta no
# navegador — sem ninguém olhando, atividade nova podia demorar horas pra
# ser detectada.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Chama /api/cgc/cron-sync
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "x-cron-secret: ${{ secrets.CGC_CRON_SECRET }}" \
            "https://checklist-kohl-seven.vercel.app/api/cgc/cron-sync")
          cat /tmp/response.json
          if [ "$status" -ge 300 ]; then
            echo "Falhou com HTTP $status"
            exit 1
          fi
